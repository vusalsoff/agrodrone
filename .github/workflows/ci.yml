name: AgroDrone CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint, Migrations & Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"

      - name: Install backend dependencies
        working-directory: apps/api
        run: uv sync --extra dev --extra s3

      - name: Lint with ruff
        working-directory: apps/api
        run: uv run ruff check app tests

      - name: Verify Alembic migrations
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///./data/ci_mig.db
        run: uv run alembic upgrade head

      - name: Run pytest suite
        working-directory: apps/api
        run: uv run pytest -v

      - name: Dependency vulnerability scan (pip-audit)
        working-directory: apps/api
        run: uv tool run pip-audit --desc || true

  frontend:
    name: Frontend Typecheck, Lint, Vitest & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: TypeScript check
        working-directory: apps/web
        run: npm run typecheck

      - name: ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Vitest unit & component tests
        working-directory: apps/web
        run: npm run test

      - name: Production Next.js build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
          NEXT_PUBLIC_ENVIRONMENT: production
        run: npm run build

      - name: npm audit (high/critical)
        working-directory: apps/web
        run: npm audit --audit-level=high || true

  containers:
    name: Container Build Verification (No Push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            build_args: ""
          - name: worker
            dockerfile: infra/docker/Dockerfile.worker
            build_args: "INSTALL_AI_EXTRAS=false"
          - name: web
            dockerfile: apps/web/Dockerfile
            build_args: "NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: false
          load: false

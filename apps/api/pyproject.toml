[project]
name = "agrodrone-api"
version = "0.3.0"
description = "AgroDrone AI-Powered Agricultural Intelligence Platform — FastAPI Control Plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pydantic>=2.10.4,<3.0.0",
    "pydantic-settings>=2.7.1,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "psycopg[binary]>=3.2.3,<4.0.0",
    "structlog>=24.4.0,<26.0.0",
    "pyjwt>=2.10.1,<3.0.0",
    "argon2-cffi>=23.1.0,<26.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "agrodrone-ai-worker",
    "agrodrone-edge-gateway",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.25.2,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "ruff>=0.8.6,<1.0.0",
]
s3 = [
    "boto3>=1.35.0,<2.0.0",
]
# Real inference runtime. Locally verified with torch 2.14.1+cpu, ultralytics 8.4.174,
# opencv 4.13.0, pillow 12.3.0, numpy 2.4.4 (CPU only, no CUDA required).
ai = [
    "ultralytics>=8.3.0,<9.0.0",
    "torch>=2.4.0,<3.0.0",
    "opencv-python-headless>=4.10.0,<5.0.0",
    "pillow>=10.0.0,<13.0.0",
    "numpy>=1.26.0,<3.0.0",
]

[tool.uv.sources]
agrodrone-ai-worker = { path = "../../services/ai-worker", editable = true }
agrodrone-edge-gateway = { path = "../../services/edge-gateway", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "real_model: runs the actual YOLOv8n checkpoint (skipped automatically if weights/runtime are missing)",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

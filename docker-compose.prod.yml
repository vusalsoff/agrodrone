# Production-like local/self-hosted compose override.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  api:
    environment:
      ENVIRONMENT: production
      LOG_FORMAT: json
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: strict
      AI_WORKER_MODE: external
      ALLOW_DIRECT_LOCAL_CAMERA_PROBE: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in production}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set in production}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?S3_ENDPOINT_URL must be set in production}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set in production}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set in production}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:?S3_BUCKET_MEDIA must be set in production}

  ai-worker:
    environment:
      ENVIRONMENT: production
      LOG_FORMAT: json
      AI_WORKER_MODE: external
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in production}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?S3_ENDPOINT_URL must be set in production}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set in production}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set in production}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:?S3_BUCKET_MEDIA must be set in production}

  web:
    build:
      args:
        NEXT_PUBLIC_ENVIRONMENT: production
    environment:
      NEXT_PUBLIC_ENVIRONMENT: production

name: agrodrone

services:
  postgres:
    image: postgres:16-alpine
    container_name: agrodrone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrodrone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrodrone_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-agrodrone}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agrodrone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrodrone} -d ${POSTGRES_DB:-agrodrone}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: agrodrone-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-agrodrone-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-agrodrone-minio-dev-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - agrodrone_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6

  minio-init:
    image: minio/mc:RELEASE.2025-02-15T10-36-16Z
    container_name: agrodrone-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-agrodrone-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-agrodrone-minio-dev-secret}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-agrodrone-media}
    volumes:
      - ./infra/docker/minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: agrodrone-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agrodrone}:${POSTGRES_PASSWORD:-agrodrone_dev_password}@postgres:5432/${POSTGRES_DB:-agrodrone}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-before-production-minimum-32-chars}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-agrodrone-minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-agrodrone-minio-dev-secret}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-agrodrone-media}
      AI_INFERENCE_ENABLED: ${AI_INFERENCE_ENABLED:-true}
      AI_WORKER_MODE: ${AI_WORKER_MODE:-external}
      ALLOW_DIRECT_LOCAL_CAMERA_PROBE: "false"
      EDGE_GATEWAY_ENABLED: ${EDGE_GATEWAY_ENABLED:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  ai-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
      args:
        INSTALL_AI_EXTRAS: ${INSTALL_AI_EXTRAS:-true}
    container_name: agrodrone-ai-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agrodrone}:${POSTGRES_PASSWORD:-agrodrone_dev_password}@postgres:5432/${POSTGRES_DB:-agrodrone}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-before-production-minimum-32-chars}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-agrodrone-minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-agrodrone-minio-dev-secret}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-agrodrone-media}
      AI_INFERENCE_ENABLED: ${AI_INFERENCE_ENABLED:-true}
      AI_WORKER_MODE: external
      AI_DEVICE: ${AI_DEVICE:-cpu}
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-1}
      AI_WEIGHTS_DIR: /app/models
    volumes:
      - agrodrone_models:/app/models
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-development}
    container_name: agrodrone-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-AgroDrone}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-development}
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  agrodrone_pgdata:
  agrodrone_minio:
  agrodrone_models:

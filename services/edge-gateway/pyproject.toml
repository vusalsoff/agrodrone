[project]
name = "agrodrone-edge-gateway"
version = "0.4.0"
description = "AgroDrone Phase 4 Field Edge Gateway — Outbound Authenticated ESP32-CAM Bridge"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<1.0.0",
    "pyserial>=3.5,<4.0",
]

[project.scripts]
agrodrone-gateway = "agrodrone_gateway.cli:main"
agrodrone-arduino = "agrodrone_gateway.arduino_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agrodrone_gateway"]
